<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>非正常人类 · 档案</title>
    <!-- 引入独立样式 -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- 背景装饰 -->
    <div class="bg-particles" id="particles"></div>

    <!-- 主卡片 -->
    <main class="profile-card">
        <!-- 头像与名字 -->
        <div class="avatar-section">
            <div class="avatar-wrapper">
                <!-- 用占位图片，你可以替换为自己的照片URL -->
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Freak" alt="非正常人类头像" class="avatar" />
                <div class="avatar-ring"></div>
            </div>
            <h1 class="name">✨ 非正常人类 · 毛宇浩 ✨</h1>
            <p class="title">🧪 首席外卖官 · 优惠券孵化师</p>
        </div>

        <!-- 个人信息 -->
        <div class="info-section">
            <div class="bio">
                <p>
                    👾 你好！我是来自 <span class="highlight">美团 星云</span> 的毛宇浩，
                    伪装成中通员工，实际身份是 <span class="highlight">「京东卧底」</span>。
                </p>
                <p>
                    🧬 我擅长把咖啡因转化为无效代码，并在凌晨三点对着屏幕发出诡异笑声。
                    目前正在研究 <span class="highlight">「如何让人类更不正常」</span>。
                </p>
            </div>

            <!-- 技能条（搞怪） -->
            <div class="skills">
                <div class="skill">
                    <span>☕ 咖啡因抗性</span>
                    <div class="bar"><div class="fill" style="width: 666%;"></div></div>
                    <span class="value">666%</span>
                </div>
                <div class="skill">
                    <span>🐛 Bug 制造率</span>
                    <div class="bar"><div class="fill" style="width: 200%;"></div></div>
                    <span class="value">∞</span>
                </div>
                <div class="skill">
                    <span>🌙 熬夜续航</span>
                    <div class="bar"><div class="fill" style="width: 99.9%;"></div></div>
                    <span class="value">99.9%</span>
                </div>
            </div>

            <!-- 互动按钮 -->
            <div class="interact">
                <button class="btn" id="detectBtn">🧪 检测非正常指数</button>
                <button class="btn" id="chaosBtn">🌀 释放混沌</button>
                <button class="btn" id="escapeBtn">🏃 别点我！</button>
                <div class="result" id="resultBox">💡 点击按钮触发非正常事件 ...</div>
            </div>

            <!-- 社交链接 -->
            <div class="socials">
                <a href="#" class="social-link">🐦 美团</a>
                <a href="#" class="social-link">📺 京东</a>
                <a href="#" class="social-link">💻 饿了吗</a>
                <a href="#" class="social-link">📷 小蚕</a>
            </div>
        </div>

        <!-- 脚注 -->
        <footer class="footer">
            <p>⚠️ 本页面由非正常人类自主设计 · 如见雷同，纯属见鬼 👻</p>
            <p class="domain">🏠 域名：非正常人类 · 版权所有 · 但你可能找不到我</p>
        </footer>
    </main>

    <!-- 引入独立脚本 -->

</html>
